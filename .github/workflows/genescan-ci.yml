name: GeneScan quality checks

on:
  push:
  pull_request:
  workflow_dispatch:


defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  security:
    name: Security and database checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install openpyxl
      - name: Clear generated audit reports
        run: rm -f "Vulnerability Test Results"/*.json "Vulnerability Test Results"/*.xlsx "Vulnerability Test Results"/*.log
      - name: Check dependencies and database controls
        run: |
          node --version
          npm ls --depth=0
          npm test
          node scripts/db-test.js | tee "Vulnerability Test Results/db-check.log"
          node security/scripts/gateway-check.js | tee "Vulnerability Test Results/gateway-check.log"
      - name: Dependency audit
        id: audit
        continue-on-error: true
        run: npm audit --json > "Vulnerability Test Results/npm-audit.json"
      - name: Semgrep source audit
        id: semgrep
        continue-on-error: true
        run: |
          python -m pip install semgrep
          semgrep scan --metrics=off --config p/javascript --config p/secrets --error --json -o "Vulnerability Test Results/semgrep.json" apps packages
      - name: Trivy source audit
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: json
          output: Vulnerability Test Results/trivy.json
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Gitleaks tracked-source scan
        id: leaks
        continue-on-error: true
        run: docker run --rm -v "$PWD:/repo" -w /repo -u "$(id -u):$(id -g)" zricethezav/gitleaks:v8.24.3 git --redact --report-format json --report-path "/repo/Vulnerability Test Results/gitleaks.json"
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical
      - name: Generate security workbook
        env:
          AUDIT: ${{ steps.audit.outcome }}
          SAST: ${{ steps.semgrep.outcome }}
          TRIVY: ${{ steps.trivy.outcome }}
          LEAKS: ${{ steps.leaks.outcome }}
        if: always()
        run: python scripts/reports.py security
      - name: Upload security results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-assessment
          path: |
            Vulnerability Test Results/*.xlsx
            Vulnerability Test Results/*.md
            Vulnerability Test Results/*.json
            Vulnerability Test Results/db-check.log
            Vulnerability Test Results/gateway-check.log
          retention-days: 30
          if-no-files-found: error
      - name: Fail on security scanner findings
        if: always()
        env:
          AUDIT: ${{ steps.audit.outcome }}
          SAST: ${{ steps.semgrep.outcome }}
          TRIVY: ${{ steps.trivy.outcome }}
          LEAKS: ${{ steps.leaks.outcome }}
        run: python scripts/security-gate.py

  selenium:
    name: Selenium browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install openpyxl
      - name: Clear prior run evidence
        run: rm -f selenium-tests/results.ndjson selenium-tests/*.log selenium-tests/*-report.xlsx
      - uses: supabase/setup-cli@v3
        with:
          version: 2.108.0
      - name: Start isolated local Supabase fixture
        run: |
          for attempt in 1 2 3; do
            supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,postgres-meta >/dev/null && break
            supabase stop --no-backup >/dev/null 2>&1 || true
            sleep 3
          done
          node scripts/ci-fixture.mjs
      - name: Start local gateway
        run: |
          node apps/gateway/server.js > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for i in {1..30}; do curl -s -o /dev/null http://127.0.0.1:8787/ && exit 0; sleep 1; done
          exit 1
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true
      - name: Build and serve web app
        run: |
          npm run build
          npx vite apps/web --host 0.0.0.0 --port 5173 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in {1..30}; do curl -fsS http://localhost:5173 >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run browser tests
        run: npm run selenium 2>&1 | tee selenium-tests/execution.log
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
      - name: Generate browser test report
        if: always()
        run: python scripts/reports.py selenium
      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-test-report
          path: |
            selenium-tests/selenium-test-report.xlsx
            selenium-tests/screenshots/
            selenium-tests/execution.log
          retention-days: 30
          if-no-files-found: error

  android-build:
    name: Build Android test APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_GATEWAY_URL: http://localhost:8787
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Build Android release APK
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: android-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  appium:
    needs: android-build
    name: Appium Android tests (group ${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      APPIUM_GROUP: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install openpyxl
      - name: Clear prior run evidence
        run: rm -f appium-tests/results.ndjson appium-tests/*.log appium-tests/*-report.xlsx
      - uses: supabase/setup-cli@v3
        with:
          version: 2.108.0
      - name: Start isolated local Supabase fixture
        run: |
          for attempt in 1 2 3; do
            supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,postgres-meta >/dev/null && break
            supabase stop --no-backup >/dev/null 2>&1 || true
            sleep 3
          done
          node scripts/ci-fixture.mjs
      - name: Start local gateway
        run: |
          node apps/gateway/server.js > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for i in {1..30}; do curl -s -o /dev/null http://127.0.0.1:8787/ && exit 0; sleep 1; done
          exit 1
      - uses: actions/download-artifact@v8
        with:
          name: android-test-apk
          path: android-test
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools emulator
      - name: Install Appium
        run: |
          npm install -g appium@3
          appium driver install uiautomator2
          appium > "$RUNNER_TEMP/appium.log" 2>&1 &
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          profile: pixel_2
          api-level: 35
          arch: x86_64
          script: |
            adb reverse tcp:8787 tcp:8787
            adb install -r android-test/app-release.apk
            bash -o pipefail -c "npm run appium 2>&1 | tee appium-tests/execution.log"
      - name: Verify every scheduled Android case passed
        run: node scripts/android-cases.js --verify
      - name: Upload Android shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-shard-${{ matrix.group }}
          path: |
            appium-tests/results.ndjson
            appium-tests/screenshots/
            appium-tests/execution.log
          retention-days: 1
          if-no-files-found: error

  appium-combined:
    name: Appium Android tests (combined report)
    needs: appium
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install report dependencies
        run: python -m pip install openpyxl
      - uses: actions/download-artifact@v8
        with:
          pattern: appium-shard-*
          path: appium-shards
      - name: Merge all 8 Android test groups
        run: |
          mkdir -p appium-tests/screenshots
          : > appium-tests/results.ndjson
          : > appium-tests/execution.log
          for dir in appium-shards/appium-shard-*; do
            if [ -f "$dir/results.ndjson" ]; then cat "$dir/results.ndjson" >> appium-tests/results.ndjson; fi
            if [ -f "$dir/execution.log" ]; then
              echo "=== $(basename "$dir") ===" >> appium-tests/execution.log
              cat "$dir/execution.log" >> appium-tests/execution.log
            fi
            if [ -d "$dir/screenshots" ]; then cp -r "$dir/screenshots/." appium-tests/screenshots/; fi
          done
      - name: Generate combined Android test report
        if: always()
        run: python scripts/reports.py appium
      - name: Upload combined Android test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-test-report
          path: |
            appium-tests/appium-test-report.xlsx
            appium-tests/screenshots/
            appium-tests/execution.log
          retention-days: 30
          if-no-files-found: error
      - name: Verify every Android case passed
        run: node scripts/android-cases.js --verify

  performance:
    name: Performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install openpyxl
      - name: Clear prior baseline evidence
        run: |
          mkdir -p performance/reports
          rm -f performance/reports/*
      - uses: supabase/setup-cli@v3
        with:
          version: 2.108.0
      - name: Start isolated local Supabase fixture
        run: |
          for attempt in 1 2 3; do
            supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,postgres-meta >/dev/null && break
            supabase stop --no-backup >/dev/null 2>&1 || true
            sleep 3
          done
          node scripts/ci-fixture.mjs
      - name: Start local gateway
        run: |
          node apps/gateway/server.js > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for i in {1..30}; do curl -s -o /dev/null http://127.0.0.1:8787/ && exit 0; sleep 1; done
          exit 1
      - uses: grafana/setup-k6-action@v1
      - name: Run 100-user baseline
        run: k6 run performance/load-test.js 2>&1 | tee performance/reports/execution.log
      - name: Generate performance report
        if: always()
        run: python scripts/reports.py performance
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-baseline
          path: performance/reports/
          retention-days: 30
          if-no-files-found: error
